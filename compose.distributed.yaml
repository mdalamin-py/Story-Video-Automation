services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: studio
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: ${STUDIO_DB_PASSWORD:?Set STUDIO_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "studio", "-d", "studio"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
  api:
    environment: &database
      STUDIO_DATABASE_URL: ${STUDIO_DATABASE_URL:?Set STUDIO_DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
  worker:
    environment: &worker
      <<: *database
      STUDIO_REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "celery", "-A", "backend.tasks", "worker", "-Q", "production,publishing", "--concurrency=1", "--loglevel=INFO"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
  beat:
    build: .
    env_file: .env
    environment: *worker
    command: ["python", "-m", "celery", "-A", "backend.tasks", "beat", "--schedule", "/studio/runs/celerybeat", "--loglevel=INFO"]
    volumes:
      - studio-data:/studio/runs
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped
volumes:
  postgres-data:
  redis-data:
