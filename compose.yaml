services:
  api:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - studio-data:/studio/runs
      - ./input:/studio/input:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    build: .
    command: ["python", "-m", "backend.worker"]
    env_file: .env
    volumes:
      - studio-data:/studio/runs
      - ./input:/studio/input:ro
    restart: unless-stopped
volumes:
  studio-data:
